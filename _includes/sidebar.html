<aside class="sidebar{% unless page.url == '/' %} sidebar-inner{% endunless %}">

  <a href="{{ '/' | relative_url }}" class="sidebar-photo">
    <img src="{{ '/assets/headshot.jpg' | relative_url }}" alt="Ehsan Suez">
  </a>

  <p class="sidebar-name"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></p>

  <p class="sidebar-affiliation">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21v-9M10 21v-9M14 21v-9M19 21v-9M3 9l9-6 9 6z"/></svg>
    Centers for Disease Control and Prevention
  </p>

  <p class="sidebar-bio">
    Steven M. Teutsch Prevention Effectiveness Fellow, Center for Forecasting and Outbreak Analytics
  </p>

  <p class="sidebar-email"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>

  <ul class="sidebar-links">
    <li>
      <a href="{{ site.google_scholar_url }}" aria-label="Google Scholar" title="Google Scholar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>
      </a>
    </li>
    <li>
      <a href="{{ '/cv/' | relative_url }}" aria-label="CV" title="CV">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>
      </a>
    </li>
    <li>
      <a href="{{ site.linkedin_url }}" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10.5V17M8 7v.01M12 17v-6.5M12 13.5c0-1.7 1.2-3 2.6-3s2.4 1.1 2.4 3V17"/></svg>
      </a>
    </li>
    <li>
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.5 1.4-4.5-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.800 5.400 3.100 5.400 3.100a4.200 4.200 0 0 0-.1 3.200A4.600 4.600 0 0 0 4 9.500c0 4.600 2.700 5.700 5.500 6-.6.600-.6 1.200-.5 2V21"/></svg>
      </a>
    </li>
  </ul>

</aside>
