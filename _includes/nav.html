<nav class="site-nav-tabs" aria-label="Main">
  <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active" aria-current="page"{% endif %}>About</a>
  {%- for path in site.header_pages -%}
    {%- assign my_page = site.pages | where: "path", path | first -%}
    {%- if my_page.title %}
  <a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} class="is-active" aria-current="page"{% endif %}>{{ my_page.title | escape }}</a>
    {%- endif -%}
  {%- endfor %}
</nav>
